services:
  postgres:
    image: postgres:16-alpine
    container_name: sivva-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sivva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sivva_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sivva}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sivva} -d ${POSTGRES_DB:-sivva}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: sivva_postgres_data
